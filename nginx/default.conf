# Si delante hay otro proxy con HTTPS (Caddy, Cloudflare, Render...), se respeta su
# X-Forwarded-Proto; si no, se usa el esquema de esta conexión.
map $http_x_forwarded_proto $esquema_publico {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    client_max_body_size 5m;

    # Cabeceras que Django necesita saber del cliente real (las heredan los
    # location que usan proxy_pass).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $esquema_publico;

    # API REST (JWT) y panel de administración de Django.
    location /api/ {
        proxy_pass http://backend:8000;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
    }

    # Estáticos del admin (los sirve WhiteNoise dentro del backend).
    location /static/ {
        proxy_pass http://backend:8000;
    }

    # Archivos con hash en el nombre: cache largo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Aplicación React: cualquier otra ruta devuelve index.html.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
